services:
  mysql:
    image: mysql:8.0
    container_name: parcial_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parcial_db}
      MYSQL_USER: ${MYSQL_USER:-parcial_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-parcial2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: parcial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcial_audit}
      POSTGRES_USER: ${POSTGRES_USER:-audit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: parcial_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-parcial_db}
      DB_USER: ${MYSQL_USER:-parcial_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-parcial2026}
      AUDIT_DB_HOST: postgres
      AUDIT_DB_PORT: 5432
      AUDIT_DB_NAME: ${POSTGRES_DB:-parcial_audit}
      AUDIT_DB_USER: ${POSTGRES_USER:-audit_user}
      AUDIT_DB_PASSWORD: ${POSTGRES_PASSWORD:-audit2026}
      JWT_SECRET: ${JWT_SECRET:-ParcialJwtSecretProduccion2026MuySeguro!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://18.230.85.195}
      SEED_ENABLED: ${SEED_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./angular-frontend
    container_name: parcial_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  postgres_data:
