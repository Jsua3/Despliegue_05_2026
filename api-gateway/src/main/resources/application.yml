server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: carniceria-api-gateway
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Powered-By, Carniceria-API-Gateway
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: orders-service
          uri: ${ORDERS_SERVICE_URL:http://orders-service:8081}
          predicates:
            - Path=/api/pedidos/**
          filters:
            - name: CircuitBreaker
              args:
                name: ordersCircuitBreaker
                fallbackUri: forward:/fallback/orders
            - AddResponseHeader=X-Routed-To, orders-service

        - id: backend
          uri: ${BACKEND_SERVICE_URL:http://backend:8080}
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: backendCircuitBreaker
                fallbackUri: forward:/fallback/backend
            - AddResponseHeader=X-Routed-To, backend

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://18.230.85.195}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      backendCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      ordersCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  timelimiter:
    instances:
      backendCircuitBreaker:
        timeoutDuration: 10s
      ordersCircuitBreaker:
        timeoutDuration: 10s

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.parcial.gateway: DEBUG
