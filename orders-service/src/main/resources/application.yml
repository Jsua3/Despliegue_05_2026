server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: carniceria-orders-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:parcial_orders}
    username: ${POSTGRES_USER:orders_user}
    password: ${POSTGRES_PASSWORD:orders2026}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  jwt:
    secret: ${JWT_SECRET:ParcialJwtSecretProduccion2026MuySeguro!!}
