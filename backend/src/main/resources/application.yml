server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: plantilla-parcial
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parcial_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:parcial_user}
    password: ${DB_PASSWORD:parcial2026}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  jwt:
    secret: ${JWT_SECRET:ParcialJwtSecretProduccion2026MuySeguro!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    enabled: ${SEED_ENABLED:true}
